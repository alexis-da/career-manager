# The tests of every push on main and of every pull request: types, lint, the unit and database tests (Vitest), then a
# quick selection of the end-to-end tests (Playwright, npm run test:e2e:quick), in one job: a second job would install
# everything and seed a second database, minutes that count on the account's quota (the repository is private). The
# whole end-to-end suite and the slow tests run once a week (weekly.yml).
# The job has its own throwaway PostgreSQL (a service of the job, on localhost), migrated from zero and seeded. Every
# value below is fake and written here: this workflow reads no secret of the repository (those of the maintenance are
# for maintenance.yml and challenge.yml alone), Neon's address and password are nowhere in GitHub (only in Vercel's
# settings), and the code refuses any database outside localhost (src/db/database-url.ts) unless VERCEL=1 or
# ALLOW_REMOTE_DB=1, which nothing here sets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request makes its older run pointless; on main, every push keeps its result.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Fake values only: the database of the job's PostgreSQL service, and a secret that signs nothing real.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/latewinner_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/latewinner_test
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/latewinner_test
  AUTH_SECRET: ci-fake-secret-for-throwaway-test-databases
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  gate:
    # main fast-forwarded to a pull request's head gets the very commit that request tested: it is not tested twice.
    name: Already tested in its pull request?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Test unless this commit of main passed in a pull request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "push" ]; then
            tested=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=pull_request&status=success&per_page=1" \
              --jq .total_count || echo 0)
            if [ "$tested" != "0" ]; then
              echo "::notice::$SHA already passed in its pull request: nothing more to test"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  ci:
    name: Types, lint, Vitest, quick E2E
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: latewinner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname latewinner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --shm-size 256m
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - name: Next's route types (PageProps, LayoutProps), which a fresh checkout lacks
        run: npx next typegen
      - name: Types (tsc)
        run: npx tsc --noEmit
      - name: Lint (ESLint)
        run: npm run lint
      - uses: ./.github/actions/test-database
        with:
          postgres: ${{ job.services.postgres.id }}
      - name: Unit and database tests (Vitest)
        run: npm run test
      - uses: ./.github/actions/playwright
      - name: Quick end-to-end selection (Playwright)
        run: npm run test:e2e:quick
      - name: Keep the Playwright report and the failures' screenshots, 7 days
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-quick-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
