# Daily maintenance of the production database: the purge of anonymous users, then of the saves of finished weekly
# challenges (app/api/maintenance/purge/route.ts); then the cleanup of the match events no screen reads any more
# (app/api/maintenance/cleanup/route.ts), counted only until told to delete.
# Secrets of the repository: MAINTENANCE_URL, the purge's full address
# (https://www.latewinner.app/api/maintenance/purge), the cleanup's next to it (…/api/maintenance/cleanup), and
# MAINTENANCE_SECRET, the same value as on Vercel.
# The purge's mode: on a manual run, its « purge » input; on the daily run, « daily ». daily: the anonymous users not
# seen for 30 days, without a save for 24 hours, and those seen only on the day they were created (a career never
# resumed) after 14 days if the repository variable PURGE_ONE_DAY is « delete », only counted otherwise; count: one call
# with ?dryRun=1&oneDay=1, which deletes nothing and says what each rule would remove; one-day: as daily, the 14-day rule
# included whatever the variable.
# The cleanup's mode: on a manual run, its « cleanup » input; on the daily run, the repository variable EVENT_CLEANUP
# (Settings → Secrets and variables → Actions → Variables), « count » without it. count: one call with ?dryRun=1, which
# deletes nothing; delete: calls until nothing is left, at most MAX_CALLS; skip: nothing. Every call shows in /admin.
# Then the archive of the completed seasons (app/api/maintenance/archive/route.ts), off unless told: on a manual run,
# its « archive » input; on the daily run, the repository variable SEASON_ARCHIVE, « skip » without it. count: one call
# with ?dryRun=1, which writes nothing but its pass; archive: archives the completed seasons, deletes nothing, call after
# call until none is left; delete: archives them, then deletes the rows of the seasons archived two minutes ago or more,
# each compared with its archive first, batch after batch; skip: nothing. Every call shows in /admin, Santé.
name: Maintenance

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC, every day
  workflow_dispatch:
    inputs:
      purge:
        description: "Anonymous users: as every day (the 14-day rule if PURGE_ONE_DAY is delete), count what each rule would remove (dryRun, nothing deleted), or with the 14-day rule"
        type: choice
        options:
          - daily
          - count
          - one-day
        default: daily
      cleanup:
        description: "Match events nothing reads: count them (dryRun, nothing deleted), delete them by batches, or skip"
        type: choice
        options:
          - count
          - delete
          - skip
        default: count
      archive:
        description: "Completed seasons: skip, count (dryRun, nothing written), archive them (nothing deleted), or archive then delete their checked rows by batches"
        type: choice
        options:
          - skip
          - count
          - archive
          - delete
        default: skip

permissions: {}

jobs:
  purge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Purge the anonymous users and the finished challenges' saves, batch after batch
        env:
          MAINTENANCE_URL: ${{ secrets.MAINTENANCE_URL }}
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.purge || 'daily' }}
          ONE_DAY: ${{ vars.PURGE_ONE_DAY }}
          MAX_CALLS: 20 # each call deletes at most 25 users and 10 challenge saves
        run: |
          case "$MODE" in
            daily) if [ "$ONE_DAY" = "delete" ]; then query="?oneDay=1"; else query=""; fi; calls="$MAX_CALLS" ;;
            count) query="?dryRun=1&oneDay=1"; calls=1 ;;
            one-day) query="?oneDay=1"; calls="$MAX_CALLS" ;;
            *) echo "::error::Unknown purge mode « $MODE »: daily, count or one-day"; exit 1 ;;
          esac
          for call in $(seq 1 "$calls"); do
            status=$(curl --silent --show-error --max-time 90 --output response.json --write-out "%{http_code}" --request POST --header "Authorization: Bearer ${MAINTENANCE_SECRET}" "${MAINTENANCE_URL}${query}")
            echo "Call $call ($MODE): HTTP $status $(cat response.json)"
            if [ "$status" != "200" ]; then
              echo "::error::The purge answered HTTP $status"
              exit 1
            fi
            remaining=$(jq -r '.remaining' response.json)
            if [ "$remaining" = "0" ]; then
              exit 0
            fi
          done
          if [ "$MODE" = "count" ]; then
            echo "Counted, nothing deleted: byRule says what each rule would remove"
          else
            echo "::warning::$remaining anonymous users or challenge saves still to purge after $calls calls: the next run goes on"
          fi

  cleanup:
    needs: purge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Clean up the match events no screen reads, counted or deleted batch after batch
        env:
          MAINTENANCE_URL: ${{ secrets.MAINTENANCE_URL }}
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup || vars.EVENT_CLEANUP || 'count' }}
          MAX_CALLS: 10 # each call deletes at most 20,000 rows, for 20 seconds at most
        run: |
          url="${MAINTENANCE_URL%/purge}/cleanup"
          case "$MODE" in
            skip) echo "Cleanup skipped"; exit 0 ;;
            count) query="?dryRun=1"; calls=1 ;;
            delete) query=""; calls="$MAX_CALLS" ;;
            *) echo "::error::Unknown cleanup mode « $MODE »: count, delete or skip"; exit 1 ;;
          esac
          for call in $(seq 1 "$calls"); do
            status=$(curl --silent --show-error --max-time 90 --output response.json --write-out "%{http_code}" --request POST --header "Authorization: Bearer ${MAINTENANCE_SECRET}" "${url}${query}")
            echo "Call $call ($MODE): HTTP $status $(cat response.json)"
            if [ "$status" != "200" ]; then
              echo "::error::The cleanup answered HTTP $status"
              exit 1
            fi
            remaining=$(jq -r '.remaining' response.json)
            if [ "$remaining" = "0" ]; then
              exit 0
            fi
          done
          if [ "$MODE" = "delete" ]; then
            echo "::warning::$remaining rows still to clean up after $calls calls: the next run goes on"
          fi

  archive:
    needs: cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Archive the completed seasons, counted, archived, or archived then pruned batch after batch
        env:
          MAINTENANCE_URL: ${{ secrets.MAINTENANCE_URL }}
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.archive || vars.SEASON_ARCHIVE || 'skip' }}
          MAX_CALLS: 30 # each call starts no season after 20 seconds
        run: |
          url="${MAINTENANCE_URL%/purge}/archive"
          case "$MODE" in
            skip) echo "Archive skipped"; exit 0 ;;
            count) query="?dryRun=1"; calls=1 ;;
            archive) query=""; calls="$MAX_CALLS" ;;
            delete) query="?delete=1"; calls="$MAX_CALLS" ;;
            *) echo "::error::Unknown archive mode « $MODE »: skip, count, archive or delete"; exit 1 ;;
          esac
          for call in $(seq 1 "$calls"); do
            status=$(curl --silent --show-error --max-time 90 --output response.json --write-out "%{http_code}" --request POST --header "Authorization: Bearer ${MAINTENANCE_SECRET}" "${url}${query}")
            echo "Call $call ($MODE): HTTP $status $(cat response.json)"
            if [ "$status" != "200" ]; then
              echo "::error::The archive answered HTTP $status"
              exit 1
            fi
            if [ "$(jq -r '.mismatches' response.json)" != "0" ]; then
              echo "::warning::Seasons left as rows, nothing of them deleted: see /admin, Santé"
            fi
            remaining=$(jq -r '.remaining' response.json)
            progress=$(jq -r '.archived + .deletedSeasons' response.json)
            # Nothing left, or nothing more this call could do (seasons archived too recently to delete, or left as rows).
            if [ "$remaining" = "0" ] || [ "$progress" = "0" ]; then
              exit 0
            fi
          done
          echo "::warning::$remaining seasons still to archive or prune after $calls calls: the next run goes on"
