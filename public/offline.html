<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B1340" />
    <title>Late Winner</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        box-sizing: border-box;
        background: #0b1340;
        color: #ffffff;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 0.5rem;
        line-height: 1.5;
      }
      .en {
        color: #8fa0ff;
      }
      button {
        margin-top: 1rem;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border: none;
        border-radius: 14px;
        background: #ff9f1c;
        color: #0b1340;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Shown by the service worker (sw.js) when a page cannot load: the game needs its server, nothing plays offline. -->
    <main>
      <h1>Pas de connexion</h1>
      <p>Late Winner a besoin d’internet pour jouer. Ta carrière t’attend : réessaie dès que tu es en ligne.</p>
      <p class="en" lang="en">No connection. Late Winner needs the internet to play: try again once you are online.</p>
      <button type="button" onclick="location.reload()">Réessayer · Try again</button>
    </main>
  </body>
</html>
